{% extends "base.html" %}

{% block title %}
NovaOps | Edit Server
{% endblock %}

{% block page_title %}
Edit Server
{% endblock %}

{% block content %}

<div class="welcome">

    <div>
        <h1>Edit Server</h1>
        <p>Update your infrastructure server details.</p>
    </div>

</div>

<div class="form-card">

    <form method="POST">

        <div class="form-group">

            <label for="name">Server Name</label>

            <input type="text" id="name" name="name" value="{{ server.name }}" required>

        </div>

        <div class="form-group">

            <label for="ip_address">IP Address</label>

            <input type="text" id="ip_address" name="ip_address" value="{{ server.ip_address }}" required>

        </div>

        <div class="form-group">

            <label for="provider">Provider</label>

            <select id="provider" name="provider" required>

                <option value="AWS" {% if server.provider=="AWS" %}selected{% endif %}>
                    AWS
                </option>

                <option value="Azure" {% if server.provider=="Azure" %}selected{% endif %}>
                    Azure
                </option>

                <option value="GCP" {% if server.provider=="GCP" %}selected{% endif %}>
                    GCP
                </option>

                <option value="On-Premise" {% if server.provider=="On-Premise" %}selected{% endif %}>
                    On-Premise
                </option>

            </select>

        </div>

        <div class="form-group">

            <label for="region">Region</label>

            <input type="text" id="region" name="region" value="{{ server.region }}" required>

        </div>

        <div class="form-group">

            <label for="status">Status</label>

            <select id="status" name="status" required>

                <option value="Running" {% if server.status=="Running" %}selected{% endif %}>
                    Running
                </option>

                <option value="Stopped" {% if server.status=="Stopped" %}selected{% endif %}>
                    Stopped
                </option>

                <option value="Failed" {% if server.status=="Failed" %}selected{% endif %}>
                    Failed
                </option>

            </select>

        </div>

        <div class="form-actions">

            <button type="submit" class="primary-btn">
                Update Server
            </button>

            <a href="{{ url_for('servers') }}" class="secondary-btn">
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
