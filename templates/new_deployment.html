{% extends "base.html" %}

{% block title %}
NovaOps | New Deployment
{% endblock %}

{% block page_title %}
New Deployment
{% endblock %}

{% block content %}

<div class="welcome">

    <div>
        <h1>New Deployment</h1>
        <p>Register a new application deployment.</p>
    </div>

</div>


<div class="form-card">

    {% if error %}

    <div class="form-error">
        {{ error }}
    </div>

    {% endif %}


    <form method="POST">

        <!-- PROJECT -->

        <div class="form-group">

            <label for="project_id">
                Project
            </label>

            <select id="project_id" name="project_id" required>

                <option value="">
                    Select Project
                </option>

                {% for project in projects %}

                <option value="{{ project.id }}">
                    {{ project.name }}
                </option>

                {% endfor %}

            </select>

        </div>


        <!-- SERVER -->

        <div class="form-group">

            <label for="server_id">
                Server
            </label>

            <select id="server_id" name="server_id" required disabled>

                <option value="">
                    Select a project first
                </option>

            </select>

        </div>


        <!-- ENVIRONMENT -->

        <div class="form-group">

            <label for="environment">
                Environment
            </label>

            <select id="environment" name="environment" required>

                <option value="">
                    Select Environment
                </option>

                <option value="Development">
                    Development
                </option>

                <option value="Staging">
                    Staging
                </option>

                <option value="Production">
                    Production
                </option>

            </select>

        </div>


        <!-- VERSION -->

        <div class="form-group">

            <label for="version">
                Version
            </label>

            <input type="text" id="version" name="version" placeholder="e.g. v1.0.0" required>

        </div>


        <!-- STATUS -->

        <div class="form-group">

            <label for="status">
                Status
            </label>

            <select id="status" name="status" required>

                <option value="Successful">
                    Successful
                </option>

                <option value="In Progress">
                    In Progress
                </option>

                <option value="Failed">
                    Failed
                </option>

            </select>

        </div>


        <!-- ACTIONS -->

        <div class="form-actions">

            <button type="submit" class="primary-btn">
                Create Deployment
            </button>

            <a href="{{ url_for('deployments') }}" class="secondary-btn">
                Cancel
            </a>

        </div>

    </form>

</div>


<script>
    document.addEventListener("DOMContentLoaded", function () {

        const projectSelect = document.getElementById("project_id");
        const serverSelect = document.getElementById("server_id");


        projectSelect.addEventListener("change", async function () {

            const projectId = this.value;


            // Reset server dropdown
            serverSelect.innerHTML = "";

            serverSelect.disabled = true;


            if (!projectId) {

                const option = document.createElement("option");

                option.value = "";
                option.textContent = "Select a project first";

                serverSelect.appendChild(option);

                return;
            }


            // Loading state
            const loadingOption = document.createElement("option");

            loadingOption.value = "";
            loadingOption.textContent = "Loading servers...";

            serverSelect.appendChild(loadingOption);


            try {

                const response = await fetch(
                    `/api/projects/${projectId}/servers`
                );


                if (!response.ok) {
                    throw new Error(
                        `Server request failed: ${response.status}`
                    );
                }


                const servers = await response.json();


                // Clear loading option
                serverSelect.innerHTML = "";


                // No servers
                if (servers.length === 0) {

                    const option = document.createElement("option");

                    option.value = "";
                    option.textContent =
                        "No servers assigned to this project";

                    serverSelect.appendChild(option);

                    serverSelect.disabled = true;

                    return;
                }


                // Default option
                const defaultOption = document.createElement("option");

                defaultOption.value = "";
                defaultOption.textContent = "Select Server";
                defaultOption.selected = true;

                serverSelect.appendChild(defaultOption);


                // Add servers
                servers.forEach(function (server) {

                    const option = document.createElement("option");

                    option.value = server.id;
                    option.textContent = server.name;

                    serverSelect.appendChild(option);

                });


                // IMPORTANT:
                // Enable the select so server_id is submitted
                serverSelect.disabled = false;

            } catch (error) {

                console.error(
                    "Unable to load servers:",
                    error
                );


                serverSelect.innerHTML = "";

                const option = document.createElement("option");

                option.value = "";
                option.textContent = "Unable to load servers";

                serverSelect.appendChild(option);

                serverSelect.disabled = true;
            }

        });

    });
</script>

{% endblock %}
