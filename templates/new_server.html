{% extends "base.html" %}

{% block title %}
NovaOps | Add Server
{% endblock %}

{% block page_title %}
Add Server
{% endblock %}

{% block content %}

<div class="welcome">

    <div>
        <h1>Add Server</h1>
        <p>Register a new infrastructure server.</p>
    </div>

</div>

<div class="form-card">

    <form method="POST">

        <div class="form-group">

            <label for="name">Server Name</label>

            <input type="text" id="name" name="name" placeholder="e.g. Production Server" required>

        </div>

        <div class="form-group">

            <label for="ip_address">IP Address</label>

            <input type="text" id="ip_address" name="ip_address" placeholder="e.g. 192.168.1.10" required>

        </div>

        <div class="form-group">

            <label for="provider">Provider</label>

            <select id="provider" name="provider" required>

                <option value="">Select Provider</option>
                <option value="AWS">AWS</option>
                <option value="Azure">Azure</option>
                <option value="GCP">GCP</option>
                <option value="On-Premise">On-Premise</option>

            </select>

        </div>

        <div class="form-group">

            <label for="region">Region</label>

            <input type="text" id="region" name="region" placeholder="e.g. ap-south-1" required>

        </div>

        <div class="form-group">

            <label for="status">Status</label>

            <select id="status" name="status" required>

                <option value="Running">Running</option>
                <option value="Stopped">Stopped</option>
                <option value="Failed">Failed</option>

            </select>

        </div>

        <button type="submit" class="primary-btn">
            Add Server
        </button>

    </form>

</div>

{% endblock %}
