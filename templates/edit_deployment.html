{% extends "base.html" %}

{% block title %}
NovaOps | Edit Deployment
{% endblock %}

{% block page_title %}
Edit Deployment
{% endblock %}

{% block content %}

<div class="welcome">

    <div>

        <h1>
            Edit Deployment
        </h1>

        <p>
            Update deployment configuration and status.
        </p>

    </div>

</div>


<div class="form-card">

    {% if error %}

    <div class="form-error">
        {{ error }}
    </div>

    {% endif %}


    <form method="POST">

        <!-- =========================================
             PROJECT
        ========================================= -->

        <div class="form-group">

            <label for="project_id">
                Project
            </label>

            <select id="project_id" name="project_id" required>

                <option value="">
                    Select Project
                </option>

                {% for project in projects %}

                <option value="{{ project.id }}" {% if deployment.project_id==project.id %} selected {% endif %}>
                    {{ project.name }}
                </option>

                {% endfor %}

            </select>

        </div>


        <!-- =========================================
             SERVER
        ========================================= -->

        <div class="form-group">

            <label for="server_id">
                Server
            </label>

            <select id="server_id" name="server_id" required disabled>

                <option value="">
                    Loading servers...
                </option>

            </select>

        </div>


        <!-- =========================================
             ENVIRONMENT
        ========================================= -->

        <div class="form-group">

            <label for="environment">
                Environment
            </label>

            <select id="environment" name="environment" required>

                <option value="Development" {% if deployment.environment=="Development" %} selected {% endif %}>
                    Development
                </option>

                <option value="Staging" {% if deployment.environment=="Staging" %} selected {% endif %}>
                    Staging
                </option>

                <option value="Production" {% if deployment.environment=="Production" %} selected {% endif %}>
                    Production
                </option>

            </select>

        </div>


        <!-- =========================================
             VERSION
        ========================================= -->

        <div class="form-group">

            <label for="version">
                Version
            </label>

            <input type="text" id="version" name="version" value="{{ deployment.version }}" placeholder="e.g. v1.0.0"
                required>

        </div>


        <!-- =========================================
             STATUS
        ========================================= -->

        <div class="form-group">

            <label for="status">
                Status
            </label>

            <select id="status" name="status" required>

                <option value="Successful" {% if deployment.status=="Successful" %} selected {% endif %}>
                    Successful
                </option>

                <option value="In Progress" {% if deployment.status=="In Progress" %} selected {% endif %}>
                    In Progress
                </option>

                <option value="Failed" {% if deployment.status=="Failed" %} selected {% endif %}>
                    Failed
                </option>

            </select>

        </div>


        <!-- =========================================
             FORM ACTIONS
        ========================================= -->

        <div class="form-actions">

            <button type="submit" class="primary-btn">
                Update Deployment
            </button>

            <a href="{{ url_for('deployments') }}" class="secondary-btn">
                Cancel
            </a>

        </div>

    </form>

</div>


<script>

    document.addEventListener(
        "DOMContentLoaded",
        function () {

            const projectSelect =
                document.getElementById("project_id");

            const serverSelect =
                document.getElementById("server_id");


            const currentServerId =
                "{{ deployment.server_id }}";


            async function loadServers(projectId) {

                serverSelect.innerHTML = "";

                serverSelect.disabled = true;


                if (!projectId) {

                    const option =
                        document.createElement("option");

                    option.value = "";

                    option.textContent =
                        "Select a project first";

                    serverSelect.appendChild(option);

                    return;
                }


                const loadingOption =
                    document.createElement("option");

                loadingOption.value = "";

                loadingOption.textContent =
                    "Loading servers...";

                serverSelect.appendChild(
                    loadingOption
                );


                try {

                    const response =
                        await fetch(
                            `/api/projects/${projectId}/servers`
                        );


                    if (!response.ok) {

                        throw new Error(
                            "Failed to load servers"
                        );

                    }


                    const servers =
                        await response.json();


                    serverSelect.innerHTML = "";


                    if (servers.length === 0) {

                        const option =
                            document.createElement(
                                "option"
                            );

                        option.value = "";

                        option.textContent =
                            "No servers assigned to this project";

                        serverSelect.appendChild(
                            option
                        );

                        serverSelect.disabled = true;

                        return;
                    }


                    const defaultOption =
                        document.createElement(
                            "option"
                        );

                    defaultOption.value = "";

                    defaultOption.textContent =
                        "Select Server";

                    serverSelect.appendChild(
                        defaultOption
                    );


                    servers.forEach(
                        function (server) {

                            const option =
                                document.createElement(
                                    "option"
                                );


                            option.value =
                                server.id;

                            option.textContent =
                                server.name;


                            if (
                                String(server.id) ===
                                String(currentServerId)
                            ) {

                                option.selected = true;

                            }


                            serverSelect.appendChild(
                                option
                            );

                        }
                    );


                    serverSelect.disabled = false;

                } catch (error) {

                    console.error(
                        "Unable to load servers:",
                        error
                    );


                    serverSelect.innerHTML = "";


                    const option =
                        document.createElement(
                            "option"
                        );

                    option.value = "";

                    option.textContent =
                        "Unable to load servers";

                    serverSelect.appendChild(
                        option
                    );

                    serverSelect.disabled = true;

                }

            }


            /*
             * Load the current project's servers
             * when the page opens.
             */

            loadServers(
                projectSelect.value
            );


            /*
             * Reload servers when project changes.
             */

            projectSelect.addEventListener(
                "change",
                function () {

                    loadServers(
                        this.value
                    );

                }
            );

        }
    );

</script>

{% endblock %}
