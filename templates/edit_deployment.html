{% extends "base.html" %}

{% block title %}
NovaOps | Edit Deployment
{% endblock %}

{% block page_title %}
Edit Deployment
{% endblock %}

{% block content %}

<div class="welcome">

    <div>
        <h1>Edit Deployment</h1>
        <p>Update deployment configuration and status.</p>
    </div>

</div>


<div class="form-card">

    <form method="POST">

        <!-- Project -->

        <div class="form-group">

            <label for="project_id">
                Project
            </label>

            <select id="project_id" name="project_id" required>

                <option value="">
                    Select Project
                </option>

                {% for project in projects %}

                <option value="{{ project.id }}" {% if deployment.project_id==project.id %} selected {% endif %}>
                    {{ project.name }}
                </option>

                {% endfor %}

            </select>

        </div>


        <!-- Server -->

        <div class="form-group">

            <label for="server_id">
                Server
            </label>

            <select id="server_id" name="server_id" required>

                <option value="">
                    Select Server
                </option>

                {% for server in servers %}

                <option value="{{ server.id }}" {% if deployment.server_id==server.id %} selected {% endif %}>
                    {{ server.name }}
                </option>

                {% endfor %}

            </select>

        </div>


        <!-- Environment -->

        <div class="form-group">

            <label for="environment">
                Environment
            </label>

            <select id="environment" name="environment" required>

                <option value="Development" {% if deployment.environment=="Development" %} selected {% endif %}>
                    Development
                </option>

                <option value="Staging" {% if deployment.environment=="Staging" %} selected {% endif %}>
                    Staging
                </option>

                <option value="Production" {% if deployment.environment=="Production" %} selected {% endif %}>
                    Production
                </option>

            </select>

        </div>


        <!-- Version -->

        <div class="form-group">

            <label for="version">
                Version
            </label>

            <input type="text" id="version" name="version" value="{{ deployment.version }}" placeholder="e.g. v1.0.0"
                required>

        </div>


        <!-- Status -->

        <div class="form-group">

            <label for="status">
                Status
            </label>

            <select id="status" name="status" required>

                <option value="Successful" {% if deployment.status=="Successful" %} selected {% endif %}>
                    Successful
                </option>

                <option value="In Progress" {% if deployment.status=="In Progress" %} selected {% endif %}>
                    In Progress
                </option>

                <option value="Failed" {% if deployment.status=="Failed" %} selected {% endif %}>
                    Failed
                </option>

            </select>

        </div>


        <!-- Actions -->

        <div class="form-actions">

            <button type="submit" class="primary-btn">
                Update Deployment
            </button>

            <a href="{{ url_for('deployments') }}" class="secondary-btn">
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
